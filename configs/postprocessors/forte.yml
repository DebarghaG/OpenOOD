postprocessor:
  name: forte
  APS_mode: False
  postprocessor_args:
    nearest_k: 5
    variant: gmm
    # 'test' (paper protocol): the ID evaluation pool is split 67/33 into
    # reference+fit / held-out, and only the held-out part is evaluated.
    # 'train': reference+fit come from the ID train set and the full ID
    # test set is evaluated (expect lower scores from train/test shift).
    reference_pool: test
    heldout_fraction: 0.33
    n_setup_samples: 100000
    density_fit_cap: 20000
    gmm_components: [1, 2, 4, 8, 16, 32, 64, 128, 256]
    seed: 0
    kde_jitter: 0.001
    feature_cache_dir: null
  postprocessor_sweep:
    variant_list: [gmm, kde, ocsvm]
